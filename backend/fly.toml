# fly.toml app configuration file generated for expensy-api on 2026-05-31T15:05:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'expensy-api'
primary_region = 'cdg'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'
  seed_command = 'tsx prisma/seed.ts'

[env]
  PORT = '3000'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    hard_limit = 200
    soft_limit = 50
    type = 'requests'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
