<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Expensy — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }
    input, button { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ── THEME ──────────────────────────────────────────────────────── */
    const T = {
      blue:        '#1B45D0',
      blueDark:    '#0C228E',
      blueGrad:    'linear-gradient(145deg, #0C228E 0%, #1B45D0 55%, #2D5FF5 100%)',
      blueLight:   '#E8EFFE',
      blueMid:     '#6B8FFF',
      orange:      '#F56B1E',
      orangeLight: '#FEF0E8',
      green:       '#16A34A',
      greenLight:  '#DCFCE7',
      red:         '#DC2626',
      redLight:    '#FEE2E2',
      purple:      '#7C3AED',
      purpleLight: '#EDE9FE',
      pink:        '#DB2777',
      pinkLight:   '#FCE7F3',
      teal:        '#0891B2',
      tealLight:   '#CFFAFE',
      ink:         '#0C1530',
      inkMid:      '#4A5675',
      inkLight:    '#96A5BE',
      inkFaint:    '#D5DDF0',
      bg:          '#EEF3FF',
      card:        '#FFFFFF',
      border:      '#DDE6FF',
    };

    /* ── SAMPLE DATA ────────────────────────────────────────────────── */
    const TX = [
      { id:1, cat:'FD', catName:'Food & Drink',  desc:'Morning Coffee',  amount:-5.40,   date:'Today',     color:T.orange },
      { id:2, cat:'TR', catName:'Transport',      desc:'Uber to Office',  amount:-14.20,  date:'Today',     color:T.blue   },
      { id:3, cat:'SH', catName:'Shopping',       desc:'Amazon Order',    amount:-89.99,  date:'Yesterday', color:T.purple },
      { id:4, cat:'HL', catName:'Healthcare',     desc:'Pharmacy',        amount:-32.00,  date:'Yesterday', color:T.green  },
      { id:5, cat:'EN', catName:'Entertainment',  desc:'Netflix',         amount:-15.99,  date:'May 21',    color:T.pink   },
      { id:6, cat:'FD', catName:'Food & Drink',   desc:'Grocery Store',   amount:-67.30,  date:'May 21',    color:T.orange },
      { id:7, cat:'IN', catName:'Income',         desc:'Monthly Salary',  amount:5200.00, date:'May 20',    color:T.green  },
    ];

    const CATS = [
      { id:'food',   abbr:'FD', label:'Food',   color:T.orange, bg:T.orangeLight },
      { id:'travel', abbr:'TR', label:'Travel', color:T.blue,   bg:T.blueLight   },
      { id:'shop',   abbr:'SH', label:'Shop',   color:T.purple, bg:T.purpleLight },
      { id:'health', abbr:'HL', label:'Health', color:T.green,  bg:T.greenLight  },
      { id:'fun',    abbr:'EN', label:'Fun',    color:T.pink,   bg:T.pinkLight   },
      { id:'home',   abbr:'HM', label:'Home',   color:T.teal,   bg:T.tealLight   },
    ];

    const ANLT = [
      { label:'Shopping',     amount:624.50, color:T.purple },
      { label:'Food & Drink', amount:312.80, color:T.orange },
      { label:'Transport',    amount:188.40, color:T.blue   },
      { label:'Healthcare',   amount:142.00, color:T.green  },
      { label:'Entertainment',amount:95.99,  color:T.pink   },
      { label:'Home',         amount:45.00,  color:T.teal   },
    ];

    /* ── SHARED UI ──────────────────────────────────────────────────── */
    const safeTop = { paddingTop: 'env(safe-area-inset-top, 0px)' };

    const NavIco = ({ type, color }) => {
      if (type==='home') return (
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <rect x="3" y="10" width="15" height="9" rx="2" stroke={color} strokeWidth="1.7"/>
          <path d="M1 11L10.5 2.5L20 11" stroke={color} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
          <rect x="7.5" y="13" width="6" height="6" rx="1" fill={color} opacity=".35"/>
        </svg>
      );
      if (type==='list') return (
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <rect x="3" y="4.5" width="15" height="2" rx="1" fill={color}/>
          <rect x="3" y="9.5" width="15" height="2" rx="1" fill={color}/>
          <rect x="3" y="14.5" width="9" height="2" rx="1" fill={color}/>
        </svg>
      );
      if (type==='chart') return (
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
          <rect x="2"  y="13" width="4.5" height="7"  rx="1.5" fill={color}/>
          <rect x="8.5" y="8" width="4.5" height="12" rx="1.5" fill={color}/>
          <rect x="15" y="4" width="4.5" height="16" rx="1.5" fill={color}/>
        </svg>
      );
      return null;
    };

    const BottomNav = ({ active }) => {
      const tabs = ['home','add','list','chart'];
      const labels = { home:'Home', list:'History', chart:'Stats' };
      return (
        <div style={{ position:'absolute', bottom:0, left:0, right:0, height:80, background:T.card, borderTop:`1px solid ${T.border}`, display:'flex', alignItems:'center', padding:'0 8px 6px' }}>
          {tabs.map(id => {
            const isAdd = id==='add', isActive = id===active;
            return (
              <div key={id} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
                {isAdd ? (
                  <div style={{ width:50, height:50, borderRadius:16, background:T.orange, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 4px 14px ${T.orange}55`, marginTop:-18 }}>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                      <rect x="9" y="4" width="2" height="12" rx="1" fill="white"/>
                      <rect x="4" y="9" width="12" height="2" rx="1" fill="white"/>
                    </svg>
                  </div>
                ) : (
                  <>
                    <div style={{ width:44, height:30, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:9, background:isActive?T.blueLight:'transparent' }}>
                      <NavIco type={id} color={isActive?T.blue:T.inkLight}/>
                    </div>
                    <span style={{ fontSize:10, color:isActive?T.blue:T.inkLight, fontWeight:isActive?600:400 }}>{labels[id]}</span>
                  </>
                )}
              </div>
            );
          })}
        </div>
      );
    };

    const TxRow = ({ tx }) => (
      <div style={{ display:'flex', alignItems:'center', gap:11, marginBottom:9, background:T.card, borderRadius:14, padding:'11px 13px', boxShadow:`0 1px 6px rgba(11,34,142,.07)` }}>
        <div style={{ width:40, height:40, borderRadius:12, background:tx.color+'1A', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <div style={{ width:10, height:10, borderRadius:3, background:tx.color }}/>
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <p style={{ fontSize:13.5, fontWeight:600, color:T.ink, marginBottom:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{tx.desc}</p>
          <p style={{ fontSize:11.5, color:T.inkMid }}>{tx.catName}</p>
        </div>
        <div style={{ textAlign:'right', flexShrink:0 }}>
          <p style={{ fontSize:14, fontWeight:700, color:tx.amount>0?T.green:T.ink }}>
            {tx.amount>0?'+':'-'}${Math.abs(tx.amount).toFixed(2)}
          </p>
          <p style={{ fontSize:11, color:T.inkLight }}>{tx.date}</p>
        </div>
      </div>
    );

    /* ── SCREEN 1: DASHBOARD ────────────────────────────────────────── */
    const DashboardScreen = () => (
      <div style={{ width:390, height:844, background:T.bg, position:'relative', overflow:'hidden', fontFamily:"'DM Sans',sans-serif" }}>

        {/* System status bar — white chrome; no mock time/signal UI */}
        <div style={{ background:T.card, paddingTop:'env(safe-area-inset-top, 0px)' }} />

        {/* Blue hero section */}
        <div style={{ background:T.blueGrad, paddingBottom:22 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 22px 14px' }}>
            <div>
              <p style={{ fontSize:13, color:'rgba(255,255,255,.58)', fontWeight:400, marginBottom:1 }}>Good morning,</p>
              <p style={{ fontSize:20, color:'#fff', fontWeight:700, letterSpacing:-.4 }}>Alex Chen</p>
            </div>
            <div style={{ width:40, height:40, borderRadius:13, background:'rgba(255,255,255,.18)', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7.5" r="3.5" fill="rgba(255,255,255,.9)"/>
                <path d="M3 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="rgba(255,255,255,.9)" strokeWidth="1.6" strokeLinecap="round" fill="none"/>
              </svg>
            </div>
          </div>

          {/* Balance card */}
          <div style={{ margin:'0 18px', background:'rgba(255,255,255,.13)', borderRadius:22, padding:'18px 20px', backdropFilter:'blur(10px)', border:'1px solid rgba(255,255,255,.15)' }}>
            <p style={{ fontSize:11, color:'rgba(255,255,255,.58)', marginBottom:2, letterSpacing:.9, textTransform:'uppercase' }}>Total Balance</p>
            <p style={{ fontSize:38, color:'#fff', fontWeight:700, letterSpacing:-1.5, marginBottom:16 }}>$12,450.80</p>
            <div style={{ display:'flex', gap:10 }}>
              <div style={{ flex:1, background:'rgba(255,255,255,.1)', borderRadius:13, padding:'10px 12px' }}>
                <p style={{ fontSize:10, color:'rgba(255,255,255,.58)', marginBottom:3, textTransform:'uppercase', letterSpacing:.6 }}>Income</p>
                <p style={{ fontSize:16.5, color:'#fff', fontWeight:700 }}>$5,240.00</p>
              </div>
              <div style={{ flex:1, background:'rgba(255,255,255,.1)', borderRadius:13, padding:'10px 12px' }}>
                <p style={{ fontSize:10, color:'rgba(255,255,255,.58)', marginBottom:3, textTransform:'uppercase', letterSpacing:.6 }}>Expenses</p>
                <p style={{ fontSize:16.5, color:'#fff', fontWeight:700 }}>$2,890.20</p>
              </div>
            </div>
          </div>
        </div>

        {/* Content */}
        <div style={{ padding:'16px 18px 0' }}>

          {/* Budget bar */}
          <div style={{ background:T.card, borderRadius:16, padding:'13px 15px', marginBottom:14, boxShadow:`0 2px 10px rgba(11,34,142,.07)` }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8 }}>
              <span style={{ fontSize:13.5, fontWeight:600, color:T.ink }}>Monthly Budget</span>
              <span style={{ fontSize:12.5, fontWeight:700, color:T.orange }}>72% used</span>
            </div>
            <div style={{ height:7, background:T.border, borderRadius:4, overflow:'hidden', marginBottom:5 }}>
              <div style={{ width:'72%', height:'100%', background:`linear-gradient(90deg, ${T.blue}, ${T.orange})`, borderRadius:4 }}/>
            </div>
            <p style={{ fontSize:11, color:T.inkLight }}>$2,890 of $4,000 spent this month</p>
          </div>

          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:11 }}>
            <span style={{ fontSize:15, fontWeight:700, color:T.ink }}>Recent Transactions</span>
            <span style={{ fontSize:12, color:T.blue, fontWeight:600 }}>See all →</span>
          </div>

          {TX.slice(0,4).map(tx => <TxRow key={tx.id} tx={tx}/>)}
        </div>

        <BottomNav active="home"/>
      </div>
    );

    /* ── SCREEN 2: ADD EXPENSE ──────────────────────────────────────── */
    const AddScreen = () => {
      const [val, setVal]   = useState('0');
      const [cat, setCat]   = useState('food');
      const [note, setNote] = useState('');
      const [saved, setSaved] = useState(false);

      const digit = d => setVal(v => {
        if (v==='0' && d!=='.') return String(d);
        if (d==='.' && v.includes('.')) return v;
        if (v.includes('.') && v.split('.')[1].length>=2) return v;
        return v+d;
      });
      const del = () => setVal(v => v.length<=1?'0':v.slice(0,-1));
      const save = () => { if(parseFloat(val)>0) setSaved(true); };

      if (saved) return (
        <div style={{ width:390, height:844, background:T.bg, position:'relative', overflow:'hidden', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14, fontFamily:"'DM Sans',sans-serif", ...safeTop }}>
          <div style={{ width:76, height:76, borderRadius:24, background:T.greenLight, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
              <path d="M5 17L13 25L29 9" stroke={T.green} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <div style={{ textAlign:'center' }}>
            <p style={{ fontSize:22, fontWeight:700, color:T.ink, marginBottom:6 }}>Expense Saved!</p>
            <p style={{ fontSize:14, color:T.inkMid }}>
              -${parseFloat(val).toFixed(2)} · {CATS.find(c=>c.id===cat)?.label}
            </p>
          </div>
          <button onClick={()=>{setSaved(false);setVal('0');setNote('');}} style={{ marginTop:8, padding:'13px 32px', background:T.orange, color:'#fff', borderRadius:14, border:'none', fontSize:15, fontWeight:600, cursor:'pointer', boxShadow:`0 4px 14px ${T.orange}44` }}>
            Add Another
          </button>
          <BottomNav active="add"/>
        </div>
      );

      return (
        <div style={{ width:390, height:844, background:T.bg, position:'relative', overflow:'hidden', fontFamily:"'DM Sans',sans-serif", ...safeTop }}>
          <div style={{ display:'flex', alignItems:'center', padding:'2px 18px 10px', gap:10 }}>
            <div style={{ width:34, height:34, borderRadius:10, background:T.card, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 1px 5px rgba(0,0,0,.09)' }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M9 2L4 7L9 12" stroke={T.ink} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span style={{ fontSize:18, fontWeight:700, color:T.ink }}>Add Expense</span>
          </div>

          {/* Amount */}
          <div style={{ textAlign:'center', padding:'6px 20px 14px' }}>
            <p style={{ fontSize:12, color:T.inkLight, marginBottom:4, letterSpacing:.4 }}>AMOUNT</p>
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'center', gap:4 }}>
              <span style={{ fontSize:26, fontWeight:400, color:T.inkMid, paddingBottom:4 }}>$</span>
              <span style={{ fontSize:52, fontWeight:700, color:T.ink, letterSpacing:-2 }}>{val}</span>
            </div>
            <div style={{ width:72, height:2.5, background:T.blue, borderRadius:2, margin:'6px auto 0' }}/>
          </div>

          {/* Categories */}
          <div style={{ padding:'0 18px 10px' }}>
            <p style={{ fontSize:11, fontWeight:600, color:T.inkLight, marginBottom:9, textTransform:'uppercase', letterSpacing:.8 }}>Category</p>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
              {CATS.map(c => (
                <div key={c.id} onClick={()=>setCat(c.id)} style={{ background:cat===c.id?c.color:T.card, border:`2px solid ${cat===c.id?c.color:T.border}`, borderRadius:14, padding:'10px 8px', textAlign:'center', cursor:'pointer', transition:'all .15s' }}>
                  <div style={{ width:30, height:30, borderRadius:9, background:cat===c.id?'rgba(255,255,255,.22)':c.bg, margin:'0 auto 5px', display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <span style={{ fontSize:10.5, fontWeight:700, color:cat===c.id?'#fff':c.color }}>{c.abbr}</span>
                  </div>
                  <p style={{ fontSize:11, fontWeight:500, color:cat===c.id?'#fff':T.inkMid }}>{c.label}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Note */}
          <div style={{ padding:'0 18px 10px' }}>
            <p style={{ fontSize:11, fontWeight:600, color:T.inkLight, marginBottom:7, textTransform:'uppercase', letterSpacing:.8 }}>Note</p>
            <input value={note} onChange={e=>setNote(e.target.value)} placeholder="What was this for?" style={{ width:'100%', padding:'11px 13px', borderRadius:12, border:`1.5px solid ${T.border}`, background:T.card, fontSize:13.5, color:T.ink, outline:'none' }}/>
          </div>

          {/* Numpad */}
          <div style={{ padding:'0 18px', display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:7 }}>
            {[1,2,3,4,5,6,7,8,9,'.',0,'⌫'].map((k,i) => (
              <button key={i} onClick={()=>k==='⌫'?del():digit(k)} style={{ height:44, borderRadius:12, border:'none', background:k==='⌫'?T.blueLight:T.card, color:k==='⌫'?T.blue:T.ink, fontSize:k==='⌫'?16:18, fontWeight:600, cursor:'pointer', boxShadow:`0 1px 5px rgba(11,34,142,.07)` }}>
                {k}
              </button>
            ))}
          </div>

          {/* Save */}
          <div style={{ padding:'10px 18px 0' }}>
            <button onClick={save} style={{ width:'100%', padding:'14px', borderRadius:16, border:'none', background:parseFloat(val)>0?T.orange:T.inkFaint, color:'#fff', fontSize:15.5, fontWeight:700, cursor:parseFloat(val)>0?'pointer':'default', boxShadow:parseFloat(val)>0?`0 4px 16px ${T.orange}44`:'none', transition:'all .2s' }}>
              Save Expense
            </button>
          </div>

          <BottomNav active="add"/>
        </div>
      );
    };

    /* ── SCREEN 3: TRANSACTIONS ─────────────────────────────────────── */
    const TransactionsScreen = () => {
      const months = ['March','April','May'];
      const [mi, setMi] = useState(2);

      const grouped = TX.reduce((acc,tx)=>{
        acc[tx.date] = [...(acc[tx.date]||[]), tx];
        return acc;
      }, {});

      return (
        <div style={{ width:390, height:844, background:T.bg, position:'relative', overflow:'hidden', fontFamily:"'DM Sans',sans-serif", ...safeTop }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 18px 14px' }}>
            <span style={{ fontSize:22, fontWeight:700, color:T.ink }}>Transactions</span>
            <div style={{ width:36, height:36, borderRadius:11, background:T.card, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 1px 6px rgba(11,34,142,.09)` }}>
              <svg width="16" height="13" viewBox="0 0 16 13" fill="none">
                <rect x="0"  y="0"  width="16" height="1.8" rx="0.9" fill={T.inkMid}/>
                <rect x="3"  y="5.5" width="10" height="1.8" rx="0.9" fill={T.inkMid}/>
                <rect x="6"  y="11" width="4"  height="1.8" rx="0.9" fill={T.inkMid}/>
              </svg>
            </div>
          </div>

          {/* Month nav */}
          <div style={{ display:'flex', alignItems:'center', padding:'0 18px 14px', gap:10 }}>
            <button onClick={()=>setMi(i=>Math.max(0,i-1))} style={{ width:32, height:32, borderRadius:10, background:T.card, border:`1.5px solid ${T.border}`, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M8 2.5L3.5 6.5L8 10.5" stroke={T.inkMid} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
            <span style={{ flex:1, textAlign:'center', fontSize:15, fontWeight:700, color:T.ink }}>{months[mi]} 2026</span>
            <button onClick={()=>setMi(i=>Math.min(2,i+1))} style={{ width:32, height:32, borderRadius:10, background:T.card, border:`1.5px solid ${T.border}`, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M5 2.5L9.5 6.5L5 10.5" stroke={T.inkMid} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          {/* Summary */}
          <div style={{ display:'flex', gap:10, padding:'0 18px 14px' }}>
            <div style={{ flex:1, background:T.greenLight, borderRadius:14, padding:'12px 14px' }}>
              <p style={{ fontSize:10, color:T.green, fontWeight:600, marginBottom:3, textTransform:'uppercase', letterSpacing:.6 }}>Income</p>
              <p style={{ fontSize:18, fontWeight:700, color:T.green }}>+$5,200</p>
            </div>
            <div style={{ flex:1, background:T.redLight, borderRadius:14, padding:'12px 14px' }}>
              <p style={{ fontSize:10, color:T.red, fontWeight:600, marginBottom:3, textTransform:'uppercase', letterSpacing:.6 }}>Expenses</p>
              <p style={{ fontSize:18, fontWeight:700, color:T.red }}>-$2,890</p>
            </div>
          </div>

          {/* Grouped list */}
          <div style={{ padding:'0 18px' }}>
            {Object.entries(grouped).map(([date,txs]) => (
              <div key={date} style={{ marginBottom:6 }}>
                <p style={{ fontSize:11, fontWeight:600, color:T.inkLight, marginBottom:7, textTransform:'uppercase', letterSpacing:.8 }}>{date}</p>
                {txs.map(tx => <TxRow key={tx.id} tx={tx}/>)}
              </div>
            ))}
          </div>

          <BottomNav active="list"/>
        </div>
      );
    };

    /* ── SCREEN 4: ANALYTICS ────────────────────────────────────────── */
    const AnalyticsScreen = () => {
      const total = ANLT.reduce((s,d) => s+d.amount, 0);
      const R=50, SW=13;
      const Circ = 2*Math.PI*R;
      let cum = 0;
      const segs = ANLT.map(d => {
        const len = (d.amount/total)*Circ;
        const deg = (cum/Circ)*360 - 90;
        cum += len;
        return { ...d, len: Math.max(0, len-2.5), deg };
      });

      return (
        <div style={{ width:390, height:844, background:T.bg, position:'relative', overflow:'hidden', fontFamily:"'DM Sans',sans-serif", ...safeTop }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 18px 14px' }}>
            <span style={{ fontSize:22, fontWeight:700, color:T.ink }}>Analytics</span>
            <div style={{ background:T.card, borderRadius:10, padding:'6px 13px', border:`1.5px solid ${T.border}` }}>
              <span style={{ fontSize:12, fontWeight:600, color:T.inkMid }}>May 2026</span>
            </div>
          </div>

          {/* Donut + legend */}
          <div style={{ display:'flex', alignItems:'center', padding:'0 18px 20px', gap:16 }}>
            <div style={{ position:'relative', width:170, height:170, flexShrink:0 }}>
              <svg width="170" height="170" viewBox="0 0 170 170">
                <circle cx="85" cy="85" r={R} fill="none" stroke={T.border} strokeWidth={SW}/>
                {segs.map((seg,i) => (
                  <circle key={i} cx="85" cy="85" r={R} fill="none"
                    stroke={seg.color} strokeWidth={SW}
                    strokeDasharray={`${seg.len} ${Circ}`}
                    transform={`rotate(${seg.deg}, 85, 85)`}
                  />
                ))}
              </svg>
              <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
                <p style={{ fontSize:11, color:T.inkMid, marginBottom:2 }}>Total</p>
                <p style={{ fontSize:20, fontWeight:700, color:T.ink }}>${total.toFixed(0)}</p>
              </div>
            </div>
            <div style={{ flex:1, display:'flex', flexDirection:'column', gap:10 }}>
              {ANLT.map((d,i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <div style={{ width:9, height:9, borderRadius:2.5, background:d.color, flexShrink:0 }}/>
                  <span style={{ fontSize:11.5, color:T.inkMid, flex:1 }}>{d.label}</span>
                  <span style={{ fontSize:12, fontWeight:700, color:T.ink }}>{Math.round(d.amount/total*100)}%</span>
                </div>
              ))}
            </div>
          </div>

          {/* Category bars */}
          <div style={{ padding:'0 18px' }}>
            <p style={{ fontSize:15, fontWeight:700, color:T.ink, marginBottom:13 }}>Spending Breakdown</p>
            {ANLT.map((d,i) => (
              <div key={i} style={{ marginBottom:12 }}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <div style={{ width:8, height:8, borderRadius:2, background:d.color }}/>
                    <span style={{ fontSize:13, fontWeight:500, color:T.ink }}>{d.label}</span>
                  </div>
                  <span style={{ fontSize:13, fontWeight:700, color:T.ink }}>${d.amount.toFixed(0)}</span>
                </div>
                <div style={{ height:6, background:T.border, borderRadius:3, overflow:'hidden' }}>
                  <div style={{ width:`${(d.amount/total)*100}%`, height:'100%', background:d.color, borderRadius:3 }}/>
                </div>
              </div>
            ))}
          </div>

          <BottomNav active="chart"/>
        </div>
      );
    };

    /* ── APP ────────────────────────────────────────────────────────── */
    const App = () => (
      <DCSection id="s1" title="Expensy — Mobile App">
        <DCArtboard id="a1" label="01 Dashboard" width={390} height={844}>
          <DashboardScreen/>
        </DCArtboard>
        <DCArtboard id="a2" label="02 Add Expense" width={390} height={844}>
          <AddScreen/>
        </DCArtboard>
        <DCArtboard id="a3" label="03 Transactions" width={390} height={844}>
          <TransactionsScreen/>
        </DCArtboard>
        <DCArtboard id="a4" label="04 Analytics" width={390} height={844}>
          <AnalyticsScreen/>
        </DCArtboard>
      </DCSection>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
