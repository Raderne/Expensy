name: expensy
description: Expensy — personal expense tracking (Flutter client).
publish_to: 'none'
version: 1.4.2+5003

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / routing / networking
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

  # Storage
  flutter_secure_storage: ^10.3.1
  hive_ce: ^2.13.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.5

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2

  # Codegen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Device / app metadata
  package_info_plus: ^10.1.0
  open_file: ^3.3.2

  # Integrity check for downloaded APK updates
  crypto: ^3.0.6

  # Home-screen widgets (Android AppWidgets)
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: 'ic_launcher'
  ios: false
  image_path: 'assets/icon/icon.png' # 1024×1024 PNG, square, transparent ok
  adaptive_icon_background: '#0E1B4D' # match your hero gradient
  adaptive_icon_foreground: 'assets/icon/icon_foreground.png'
  min_sdk_android: 21
