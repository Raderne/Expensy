name: expensy
description: Expensy — personal expense tracking (Flutter client).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / routing / networking
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2

  # Storage
  flutter_secure_storage: ^10.3.1
  hive_ce: ^2.13.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.5

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2

  # Codegen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
