name: Publish

# Release pipeline. Triggered by pushing to PUBLISH_V.
#  - A signed release APK is built and attached to a GitHub Release only when
#    the version in frontend/pubspec.yaml is bumped. The version/tag is read from
#    that file and the release is skipped if the tag already exists (idempotent).
#
# The backend is NOT deployed here. It is self-hosted on the Oracle VM and
# deployed with scripts/deploy.sh, run on the box (over SSH). See VM/MIGRATION.md.
on:
  push:
    branches: [PUBLISH_V]
  workflow_dispatch: # manual re-run / force a publish
    inputs:
      force_frontend:
        description: 'Force the frontend (APK + release) job to run'
        type: boolean
        default: false

# Never run two publishes for this branch at the same time.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create releases + upload APK assets

jobs:
  # ---------------------------------------------------------------------------
  # Detect which top-level folder changed and compute the release version/tag.
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes + version
    runs-on: ubuntu-latest
    outputs:
      # A manual dispatch has no diff base, so detection returns nothing —
      # fall back to the force_frontend input to make "force a publish" actually work.
      # Frontend release is gated on a version bump in pubspec.yaml, not on any
      # frontend file edit (and the tag-exists guard makes it idempotent).
      frontend: ${{ steps.version.outputs.changed == 'true' || inputs.force_frontend == true }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff pubspec against the previous commit

      - id: version
        name: Read version + detect bump in pubspec.yaml
        run: |
          file=frontend/pubspec.yaml
          parse() { grep -m1 '^version:' "$1" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/'; }

          version="$(parse "$file")"
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from $file"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # Compare the semver against the previous commit. A new/unknown base
          # (e.g. first push) counts as a bump; dispatch is handled by force_*.
          changed=false
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            prev=""
            if git cat-file -e "$before:$file" 2>/dev/null; then
              prev="$(git show "$before:$file" | parse /dev/stdin)"
            fi
            echo "Previous version: ${prev:-<none>} | current: $version"
            [ "$prev" != "$version" ] && changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (tag v$version), frontend=$changed"

  # ---------------------------------------------------------------------------
  # Frontend: build a signed release APK and publish it as a GitHub Release.
  # ---------------------------------------------------------------------------
  release-apk:
    name: build + release APK
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      TAG: ${{ needs.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the previous release

      # Idempotency guard: skip everything if the release tag already exists.
      - id: guard
        name: Check whether release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.exists == 'false'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'false'
        with:
          channel: 'stable'
          cache: true

      # Materialize the release keystore + key.properties from secrets so the
      # Gradle config signs with the real key (otherwise it falls back to debug).
      - name: Decode signing keystore
        if: steps.guard.outputs.exists == 'false'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/expensy-release.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$HOME/expensy-release.jks
          EOF

      - name: flutter pub get
        if: steps.guard.outputs.exists == 'false'
        run: flutter pub get

      - name: Build release APK
        if: steps.guard.outputs.exists == 'false'
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }} \
            --dart-define=FLAVOR=prod

      # Rename each per-ABI artifact to include the version for clean asset names.
      - name: Rename APKs
        if: steps.guard.outputs.exists == 'false'
        run: |
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/expensy-${TAG}-${abi}.apk"
          done
          ls -la dist

      # Build release notes from commit messages since the previous tag,
      # excluding merge commits.
      - name: Generate release notes
        if: steps.guard.outputs.exists == 'false'
        run: |
          prev_tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [ -n "$prev_tag" ]; then
            echo "Collecting commits since $prev_tag..."
            range="${prev_tag}..HEAD"
          else
            echo "No previous tag found — using full history."
            range="HEAD"
          fi
          {
            echo "## What's Changed"
            echo
            git log --no-merges --pretty=format:'- %s' "$range"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.guard.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: frontend/RELEASE_NOTES.md
          files: frontend/dist/expensy-*.apk
