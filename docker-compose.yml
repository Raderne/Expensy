services:
  postgres:
    image: postgres:16
    container_name: expensy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expensy
      POSTGRES_PASSWORD: expensy
      POSTGRES_DB: expensy
    ports:
      - "5432:5432"
    volumes:
      - expensy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensy -d expensy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expensy-pgdata:
